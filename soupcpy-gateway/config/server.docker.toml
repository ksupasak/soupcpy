# Gateway configuration for the container; docker-compose mounts this over
# config/server.toml so the repo's local-dev config stays untouched.

# Must be 0.0.0.0 — binding 127.0.0.1 inside the container makes the published
# port unreachable from the host.
host = "0.0.0.0"
port = 3000

# Host and port a browser uses to reach the gateway. These only affect the
# stream links the dashboard builds (/api/settings). Set public_host to the
# machine's LAN address or hostname when serving anything but your own laptop.
public_host = "localhost"
public_port = 3000
