<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multi Stream View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        min-height: 100vh;
      }
      a {
        color: inherit;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.35);
      }
      .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }
      .page-header h1 {
        margin: 0;
        font-size: clamp(1.5rem, 2vw + 1rem, 2.2rem);
      }
      .page-header p {
        margin: 0.15rem 0 0;
        color: rgba(148, 163, 184, 0.85);
        font-size: 0.95rem;
      }
      .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.5rem 0.95rem;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.18);
        color: #93c5fd;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.2s ease-in-out;
      }
      .nav-link:hover {
        background: rgba(59, 130, 246, 0.32);
      }
      .status-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        font-size: 0.95rem;
      }
      .status-indicator {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
      }
      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #fbbf24;
        box-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
        transition: background 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      }
      .status-dot.connected {
        background: #34d399;
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.85);
      }
      .status-dot.disconnected,
      .status-dot.error {
        background: #f87171;
        box-shadow: 0 0 12px rgba(248, 113, 113, 0.85);
      }
      .stream-count {
        color: rgba(148, 163, 184, 0.85);
      }
      .stream-count span {
        color: #38bdf8;
        font-weight: 600;
      }
      .filter-card {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .filter-card[hidden] {
        display: none;
      }
      .filter-card__header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .filter-card__header h2 {
        margin: 0;
        font-size: 1.15rem;
      }
      .filter-card__header p {
        margin: 0.15rem 0 0;
        color: rgba(148, 163, 184, 0.8);
        font-size: 0.9rem;
      }
      .filter-card__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
      }
      .ghost-button {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: #e2e8f0;
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
        transition: border-color 0.2s ease-in-out, color 0.2s ease-in-out;
      }
      .ghost-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .ghost-button:not(:disabled):hover {
        border-color: rgba(148, 163, 184, 0.7);
        color: #bae6fd;
      }
      .filter-card__summary {
        color: rgba(148, 163, 184, 0.85);
        font-size: 0.9rem;
      }
      .filter-chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .filter-chip {
        border: none;
        border-radius: 999px;
        padding: 0.45rem 0.85rem;
        background: rgba(15, 118, 110, 0.25);
        color: #5eead4;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease-in-out, transform 0.2s ease-in-out;
      }
      .filter-chip.active {
        background: rgba(14, 165, 233, 0.4);
        color: #e0f2fe;
        box-shadow: 0 5px 18px rgba(14, 165, 233, 0.25);
      }
      .filter-chip:focus-visible {
        outline: 2px solid rgba(96, 165, 250, 0.6);
        outline-offset: 2px;
      }
      .filter-card__hint {
        margin: 0;
        font-size: 0.85rem;
        color: rgba(148, 163, 184, 0.7);
      }
      .stream-grid {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        overflow-y: auto;
        max-height: calc(100vh - 320px);
        padding-right: 0.25rem;
        min-height: 280px;
      }
      .stream-card {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 16px;
        padding: 0.85rem;
        min-height: auto;
      }
      .stream-card__header {
        display: flex;
        flex-direction: column;
  
        gap: 0.2rem;
      }
      .stream-card__title {
        margin: 0;
        font-size: 1rem;
      }
      .stream-card__meta {
        margin: 0;
        color: rgba(148, 163, 184, 0.75);
        font-size: 0.85rem;
      }
      iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 9 / 16;
        border: none;
        border-radius: 18px;
        background: #020617;
        box-shadow: 0 12px 35px rgba(2, 6, 23, 0.45);
      }
      .empty-state {
        margin: 0;
        font-size: 0.95rem;
        color: rgba(148, 163, 184, 0.85);
      }
      @media (max-width: 600px) {
        iframe {
          aspect-ratio: 9 / 18;
        }
      }
      @media (max-width: 800px) {
        .stream-grid {
          max-height: none;
          overflow: visible;
          padding-right: 0;
        }
      }
    </style>
    <script defer="defer" src="/public/js/bundle.js"></script>
    <link href="/public/css/main.css" rel="stylesheet" />
  </head>
  <body>
    <header class="card page-header">
      <div>
        <h1>Multi Stream View</h1>
        <p>Monitor every reported stream in parallel.</p>
      </div>
      <a class="nav-link" href="/">← Back to dashboard</a>
    </header>

    <section class="card status-bar">
      <div class="status-indicator">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
      <div class="stream-count">
        Active streams: <span id="stream-count">0</span>
      </div>
    </section>

    <section id="group-filter-card" class="card filter-card" hidden>
      <div class="filter-card__header">
        <div>
          <h2>Group filter</h2>
          <p>Focus multiview on specific channel groups.</p>
        </div>
        <div class="filter-card__actions">
          <button id="reset-group-filter" class="ghost-button" type="button" disabled>
            Show all groups
          </button>
          <span id="group-filter-summary" class="filter-card__summary">Showing all groups</span>
        </div>
      </div>
      <div id="group-filter-chips" class="filter-chip-row"></div>
      <p class="filter-card__hint">
        Tip: Share a filtered view with <code>?groups=g1,g2,gx</code>.
      </p>
    </section>

    <main id="stream-grid" class="stream-grid"></main>
    <p id="empty-state" class="empty-state">Waiting for channel snapshots…</p>

    <script>
      const runtimeSettings = {
        http_base: "",
        ws_base: "",
      };

      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const streamGrid = document.getElementById("stream-grid");
      const streamCount = document.getElementById("stream-count");
      const emptyState = document.getElementById("empty-state");
      const groupFilterCard = document.getElementById("group-filter-card");
      const groupFilterChips = document.getElementById("group-filter-chips");
      const groupFilterSummary = document.getElementById("group-filter-summary");
      const resetGroupFilterButton = document.getElementById("reset-group-filter");

      let shouldFetchChannelsOnConnect = true;
      const DEFAULT_GROUP_FILTERS = ["g1", "g2", "gx"];
      const activeGroupFilters = new Set();
      let shouldAttemptDefaultGroups = true;
      let latestOverview = null;

      initializeGroupFiltersFromQuery();
      if (resetGroupFilterButton) {
        resetGroupFilterButton.addEventListener("click", handleResetGroupFilters);
      }

      function setStatus(state, text) {
        statusDot.classList.remove("connected", "disconnected", "error");
        if (state) {
          statusDot.classList.add(state);
        }
        statusText.textContent = text;
      }

      function trimTrailingSlash(value) {
        if (typeof value !== "string") {
          return value;
        }
        return value.replace(/\/+$/, "");
      }

      function buildStreamUrl(udid) {
        if (!udid) {
          return null;
        }
        const httpBase =
          trimTrailingSlash(runtimeSettings.http_base) || window.location.origin;
        const wsBase =
          trimTrailingSlash(runtimeSettings.ws_base) ||
          `${
            window.location.protocol === "https:" ? "wss" : "ws"
          }://${window.location.host}`;
        const wsQuery = `${wsBase}/ws?action=proxy-adb&remote=tcp-8886&udid=${encodeURIComponent(
          udid
        )}`;
        const encodedWs = encodeURIComponent(wsQuery);
        return `${httpBase}/stream#!action=stream&udid=${encodeURIComponent(
          udid
        )}&player=webcodecs&ws=${encodedWs}`;
      }

      function normalizeGroupName(value) {
        if (typeof value !== "string") {
          return null;
        }
        const trimmed = value.trim();
        if (trimmed === "") {
          return null;
        }
        return trimmed.toLowerCase();
      }

      function displayGroupLabel(value) {
        if (typeof value !== "string" || value.trim() === "") {
          return "Ungrouped";
        }
        return value.trim();
      }

      function extractGroupsFromParams(params) {
        const collected = [];
        params.getAll("group").forEach((value) => {
          const normalized = normalizeGroupName(value);
          if (normalized) {
            collected.push(normalized);
          }
        });
        const combined = params.get("groups");
        if (typeof combined === "string" && combined.trim() !== "") {
          combined.split(",").forEach((value) => {
            const normalized = normalizeGroupName(value);
            if (normalized) {
              collected.push(normalized);
            }
          });
        }
        return Array.from(new Set(collected));
      }

      function initializeGroupFiltersFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const fromQuery = extractGroupsFromParams(params);
        if (fromQuery.length === 0) {
          return;
        }
        fromQuery.forEach((group) => activeGroupFilters.add(group));
        shouldAttemptDefaultGroups = false;
      }

      function renderStreams(overview) {
        latestOverview = overview;
        const cards = collectRenderableCards(overview);
        const groupStats = deriveGroupStats(cards);
        ensureDefaultGroupFilters(groupStats);
        renderGroupFilterChips(groupStats);
        const visibleCards = filterCardsByGroup(cards);

        streamGrid.innerHTML = "";
        if (visibleCards.length === 0) {
          streamCount.textContent = "0";
          emptyState.style.display = "block";
          if (cards.length === 0) {
            emptyState.textContent = "Waiting for channel snapshots…";
          } else if (activeGroupFilters.size > 0) {
            emptyState.textContent = "No streams match the selected groups.";
          } else {
            emptyState.textContent = "Waiting for channel snapshots…";
          }
          return;
        }

        emptyState.style.display = "none";
        streamCount.textContent = String(visibleCards.length);

        visibleCards.forEach(({ controller, channel, streamUrl }) => {
          const card = document.createElement("article");
          card.className = "stream-card";

          const header = document.createElement("div");
          header.className = "stream-card__header";

          const title = document.createElement("h2");
          title.className = "stream-card__title";
          title.textContent = channel?.name || channel?.udid || "Unknown stream";
          header.appendChild(title);

          const meta = document.createElement("p");
          meta.className = "stream-card__meta";
          const label =
            controller?.udid && controller.udid.trim() !== ""
              ? controller.udid
              : "unknown controller";
          meta.textContent = `Controller: ${label}`;
          header.appendChild(meta);

          card.appendChild(header);

          const iframe = document.createElement("iframe");
          iframe.src = streamUrl;
          iframe.loading = "lazy";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "no-referrer";
          card.appendChild(iframe);

          streamGrid.appendChild(card);
        });
      }

      function collectRenderableCards(overview) {
        const merged = Array.isArray(overview?.merged_channels) ? overview.merged_channels : [];
        if (merged.length > 0) {
          return merged
            .map((entry) => {
              const channel = entry?.channel;
              const streamUrl = buildStreamUrl(channel?.name);
              if (!streamUrl) {
                return null;
              }
              return {
                controller: { udid: entry?.controller_udid || "unknown controller" },
                channel,
                streamUrl,
              };
            })
            .filter(Boolean);
        }

        const controllers = Array.isArray(overview?.controllers)
          ? overview.controllers
          : [];

        const cards = [];
        controllers.forEach((controller) => {
          if (!Array.isArray(controller.channels)) {
            return;
          }
          controller.channels.forEach((channel) => {
            const streamUrl = buildStreamUrl(channel?.name);
            if (!streamUrl) {
              return;
            }
            cards.push({
              controller,
              channel,
              streamUrl,
            });
          });
        });

        return cards;
      }

      function deriveGroupStats(cards) {
        if (!Array.isArray(cards) || cards.length === 0) {
          return [];
        }
        const statsMap = new Map();
        cards.forEach(({ channel }) => {
          const normalized = normalizeGroupName(channel?.group) || "ungrouped";
          if (!statsMap.has(normalized)) {
            statsMap.set(normalized, {
              normalized,
              label: displayGroupLabel(channel?.group),
              count: 0,
            });
          }
          statsMap.get(normalized).count += 1;
        });

        const prioritized = [];
        DEFAULT_GROUP_FILTERS.forEach((target) => {
          if (statsMap.has(target)) {
            prioritized.push(statsMap.get(target));
            statsMap.delete(target);
          }
        });
        const remaining = Array.from(statsMap.values()).sort((a, b) =>
          a.label.localeCompare(b.label)
        );
        return prioritized.concat(remaining);
      }

      function ensureDefaultGroupFilters(groupStats) {
        if (!shouldAttemptDefaultGroups || activeGroupFilters.size > 0) {
          return;
        }
        const defaults = DEFAULT_GROUP_FILTERS.filter((group) =>
          groupStats.some((stat) => stat.normalized === group)
        );
        if (defaults.length === 0) {
          return;
        }
        defaults.forEach((group) => activeGroupFilters.add(group));
        shouldAttemptDefaultGroups = false;
      }

      function renderGroupFilterChips(groupStats) {
        if (!groupFilterCard || !groupFilterChips || !groupFilterSummary) {
          return;
        }
        if (!Array.isArray(groupStats) || groupStats.length === 0) {
          groupFilterCard.hidden = true;
          groupFilterChips.innerHTML = "";
          groupFilterSummary.textContent = "Channel groups will appear once snapshots arrive.";
          if (resetGroupFilterButton) {
            resetGroupFilterButton.disabled = true;
          }
          return;
        }

        groupFilterCard.hidden = false;
        groupFilterChips.innerHTML = "";

        groupStats.forEach((group) => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "filter-chip";
          if (activeGroupFilters.has(group.normalized)) {
            chip.classList.add("active");
          }
          chip.textContent = `${group.label} (${group.count})`;
          chip.addEventListener("click", () => toggleGroupFilter(group.normalized));
          groupFilterChips.appendChild(chip);
        });

        if (resetGroupFilterButton) {
          resetGroupFilterButton.disabled = activeGroupFilters.size === 0;
        }
        groupFilterSummary.textContent = buildGroupFilterSummary(groupStats);
      }

      function buildGroupFilterSummary(groupStats) {
        if (activeGroupFilters.size === 0) {
          return "Showing all groups";
        }
        const selected = groupStats
          .filter((group) => activeGroupFilters.has(group.normalized))
          .map((group) => group.label);
        if (selected.length === 0) {
          return "Filtering by custom groups";
        }
        if (selected.length === 1) {
          return `Showing ${selected[0]}`;
        }
        if (selected.length === 2) {
          return `Showing ${selected.join(" and ")}`;
        }
        const [first, second, ...rest] = selected;
        if (rest.length === 0) {
          return `Showing ${first}, ${second}`;
        }
        return `Showing ${first}, ${second} + ${rest.length} more`;
      }

      function filterCardsByGroup(cards) {
        if (activeGroupFilters.size === 0) {
          return cards;
        }
        return cards.filter(({ channel }) => {
          const normalized = normalizeGroupName(channel?.group) || "ungrouped";
          return activeGroupFilters.has(normalized);
        });
      }

      function toggleGroupFilter(groupKey) {
        if (!groupKey) {
          return;
        }
        if (activeGroupFilters.has(groupKey)) {
          activeGroupFilters.delete(groupKey);
        } else {
          activeGroupFilters.add(groupKey);
        }
        shouldAttemptDefaultGroups = false;
        syncGroupFiltersToQuery();
        rerenderCachedStreams();
      }

      function handleResetGroupFilters() {
        if (activeGroupFilters.size === 0) {
          return;
        }
        activeGroupFilters.clear();
        shouldAttemptDefaultGroups = false;
        syncGroupFiltersToQuery();
        rerenderCachedStreams();
      }

      function rerenderCachedStreams() {
        if (!latestOverview) {
          return;
        }
        renderStreams(latestOverview);
      }

      function syncGroupFiltersToQuery() {
        const params = new URLSearchParams(window.location.search);
        params.delete("group");
        params.delete("groups");
        if (activeGroupFilters.size > 0) {
          params.set("groups", Array.from(activeGroupFilters).join(","));
        }
        const query = params.toString();
        const targetUrl = query ? `${window.location.pathname}?${query}` : window.location.pathname;
        window.history.replaceState({}, "", targetUrl);
      }

      function handleStructuredMessage(raw) {
        // if (typeof raw !== "string") {
        //   return false;
        // }
        // const trimmed = raw.trim();
        // if (!trimmed.startsWith("{")) {
        //   return false;
        // }

        // try {
        //   const payload = JSON.parse(trimmed);
        //   if (payload?.event === "channels_snapshot_update" && payload.overview) {
        //     renderStreams(payload.overview);
        //     return true;
        //   }
        // } catch (_error) {
        //   return false;
        // }

        return false;
      }

      async function loadSettings() {
        try {
          const response = await fetch("/api/settings");
          if (!response.ok) {
            throw new Error(`Unexpected status: ${response.status}`);
          }
          const settings = await response.json();
          if (settings && typeof settings === "object") {
            if (typeof settings.http_base === "string" && settings.http_base.trim() !== "") {
              runtimeSettings.http_base = settings.http_base;
            }
            if (typeof settings.ws_base === "string" && settings.ws_base.trim() !== "") {
              runtimeSettings.ws_base = settings.ws_base;
            }
          }
        } catch (_error) {
          // Fall back to window location when settings cannot be loaded.
        }
      }

      async function loadInitialChannels() {
        try {
          const response = await fetch("/api/channels");
          if (!response.ok) {
            throw new Error(`Unexpected status: ${response.status}`);
          }
          const overview = await response.json();
          renderStreams(overview);
          shouldFetchChannelsOnConnect = false;
        } catch (_error) {
          // Ignore initial load failures; a snapshot will arrive over the socket.
        }
      }

      function connectSocket() {
        const protocol = window.location.protocol === "https:" ? "wss" : "ws";
        const socketUrl = `${protocol}://${window.location.host}/ws`;

        setStatus("", "Connecting…");

        const ws = new WebSocket(socketUrl);

        ws.addEventListener("open", () => {
          setStatus("connected", "Connected");
          if (shouldFetchChannelsOnConnect) {
            loadInitialChannels();
          }
        });

        ws.addEventListener("message", (event) => {
          handleStructuredMessage(event.data);
        });

        ws.addEventListener("close", () => {
          setStatus("disconnected", "Disconnected – retrying…");
          shouldFetchChannelsOnConnect = true;
          setTimeout(connectSocket, 1200);
        });

        ws.addEventListener("error", () => {
          setStatus("error", "Connection error");
        });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        setStatus("", "Connecting…");
        await loadSettings();
        await loadInitialChannels();
        connectSocket();
      });
    </script>
  </body>
</html>
