apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local cluster (kind, minikube, k3s): plain http, no TLS, reachable on
# localhost through the ingress controller.
namespace: soupcpy-dev

resources:
  - namespace.yaml
  - ../../base

nameSuffix: -dev

images:
  - name: soupcpy-gateway
    newTag: dev

configMapGenerator:
  - name: soupcpy-gateway-config
    behavior: merge
    literals:
      - GATEWAY_PUBLIC_HOST=localhost
      # Port 80 and http, so generated links are http://localhost and
      # ws://localhost with no port suffix.
      - GATEWAY_PUBLIC_PORT=80
      - GATEWAY_PUBLIC_SCHEME=http
      - RUST_LOG=info,rust=debug

patches:
  - target:
      kind: Ingress
      name: soupcpy-gateway
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: localhost
